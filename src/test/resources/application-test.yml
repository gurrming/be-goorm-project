spring:
  application:
    name: heartbit-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      # 테스트마다 테이블을 새로 생성하고 삭제함
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway는 테스트 환경에서 충돌을 방지하기 위해 끄는 경우가 많습니다.
  # 만약 마이그레이션 스크립트 자체를 테스트하고 싶다면 true로 두세요.
  flyway:
    enabled: false

jwt:
  secret-key: "dGVzdC1zZWNyZXQta2V5LXNob3VsZC1iZS1sb25nLWVub3VnaC1mb3ItdGVzdGluZy1wdXJwb3Nlcw=="
  expiration-time: 3600000
  refresh-token-expiration-time: 86400000

server:
  secret-token: "test-secret-token"