spring:
  application:
    name: heartbit

server:
  tomcat:
    threads:
      max: 200           # 최대 쓰레드 수
      min-spare: 20      # 항상 유지할 최소 쓰레드 수
    max-connections: 8192 # 동시에 유지할 최대 연결 수
    accept-count: 200

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

springdoc:
  show-login-endpoint: true

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: heartbit-server

logging:
  level:
    root: WARN
    org.flywaydb: DEBUG