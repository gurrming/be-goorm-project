spring:
  application:
    name: heartbit

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    hikari:
      maximum-pool-size: 20

springdoc:
  show-login-endpoint: true

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: heartbit-server

logging:
  level:
    root: WARN
    org.flywaydb: DEBUG