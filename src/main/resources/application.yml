shard:
  id: ${SHARD_ID:1}
  channel: order-sharding-channel
  top-categories: [1, 2, 3, 4, 5, 6, 8]

spring:
  application:
    name: heartbit

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

springdoc:
  show-login-endpoint: true

jwt:
  secret-key: "c3ByaW5nLWJvb3Qtc2VjdXJpdHktand0LXR1dG9yaWFsLWppd29vbi1sprbmctYm9vdC1zZWN1cml0eS1qd3QtdHV0b3JpYWwK"
  expiration-time: 1800000
  refresh-token-expiration-time: 604800000


server:
  secret-token: "heartbit-internal-secret-token"
  

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info,metrics"

  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: heartbit-server

logging:
  level:
    root: WARN
    org.flywaydb: DEBUG