spring.application.name=heartbit

spring.datasource.url=jdbc:postgresql://localhost:15432/app
spring.datasource.username=postgres
spring.datasource.password=0000
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
springdoc.show-login-endpoint=true

jwt.secret-key=${JWT_SECRET}
jwt.expiration-time=1800000
jwt.refresh-token-expiration-time=604800000

server.secret-token = heartbit-internal-secret-token