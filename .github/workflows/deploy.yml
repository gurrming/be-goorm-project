name: Deploy Backend (Jar -> EC2 Docker)

on:
  push:
    branches: ["dev"]

permissions:
  contents: read

env:
  APP_DIR: /home/ubuntu/app
  JAR_NAME: app.jar

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ 여기서 "진짜 jar가 어디 생기는지"를 자동으로 찾아 app.jar로 고정
      - name: Build jar and normalize name
        run: |
          set -e
          ./gradlew clean build -x test

          echo "== Find jars =="
          find . -maxdepth 5 -type f -name "*.jar" -print

          # 가장 가까운 build/libs 아래 jar를 우선 선택 (plain.jar 제외)
          JAR_PATH="$(find . -maxdepth 5 -type f -path "*/build/libs/*.jar" ! -name "*plain.jar" | head -n 1)"

          if [ -z "$JAR_PATH" ]; then
            echo "ERROR: Could not find jar under */build/libs/*.jar"
            exit 1
          fi

          echo "Selected jar: $JAR_PATH"

          # 업로드용 산출물 디렉터리로 복사 (루트에 deploy-artifacts 생성)
          mkdir -p deploy-artifacts
          cp "$JAR_PATH" "deploy-artifacts/${{ env.JAR_NAME }}"

          echo "== Artifact info =="
          ls -al deploy-artifacts
          sha256sum "deploy-artifacts/${{ env.JAR_NAME }}"

      # ✅ target은 파일이 아니라 디렉터리로!
      - name: Upload app.jar to EC2 (/home/ubuntu/app)
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy-artifacts/${{ env.JAR_NAME }}
          target: ${{ env.APP_DIR }}

      - name: Deploy on EC2 (docker compose rebuild)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ env.APP_DIR }}"

            echo "== EC2: 확인 (jar 존재/해시) =="
            ls -al
            test -f "${{ env.JAR_NAME }}"
            sha256sum "${{ env.JAR_NAME }}"

            echo "== EC2: compose down =="
            sudo docker compose down --remove-orphans || true

            echo "== EC2: compose up (rebuild) =="
            sudo docker compose up -d --build --force-recreate

            echo "== EC2: running containers =="
            sudo docker ps

            echo "== EC2: image cleanup =="
            sudo docker image prune -f
