name: Deploy Backend to EC2

on:
  push:
    branches: [ "dev" ]

permissions:
  contents: read

env:
  JAR_NAME: app.jar
  APP_DIR: /home/ubuntu/app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Gradle 빌드 (jar 생성)
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew clean build -x test

      # 3️⃣ EC2에 jar 전송
      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: be-goorm-project/build/libs/app.jar
          target: ${{ env.APP_DIR }}/app.jar

      # 4️⃣ EC2에서 Docker build & compose up
      - name: Build & run Docker on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            # 기존 컨테이너 제거
            sudo docker rm -f app-api-1 prometheus grafana || true
            sudo docker compose down --remove-orphans || true

            # Docker 빌드
            sudo docker compose build --no-cache heartbit-app

            # 컨테이너 재생성
            sudo docker compose up -d --force-recreate

            # 안 쓰는 이미지 정리
            sudo docker image prune -f
