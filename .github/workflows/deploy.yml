name: Deploy Backend to EC2

on:
  push:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.run_id }}
  IMAGE_NAME: ghcr.io/${{ secrets.BACK_ACCESS_KEY }}/be-goorm-project/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ JDK 21 세팅
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3️⃣ Gradle 빌드
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build (Gradle)
        run: ./gradlew clean build -x test

      # 4️⃣ GHCR 로그인 (깃허브 액션 토큰 + BACK_ACCESS_KEY)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5️⃣ Docker 이미지 빌드 & 푸시
      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          build-args: |
            CACHE_BUST=${{ github.run_id }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 6️⃣ EC2 배포 via SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/app

            # 1️⃣ .env 자동 생성
            echo "BACK_ACCESS_KEY=${{ secrets.BACK_ACCESS_KEY }}" > .env
            echo "IMAGE_TAG=${{ github.run_id }}" >> .env

            # 2️⃣ GHCR 로그인
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3️⃣ 기존 컨테이너 종료/제거
            sudo docker compose down --remove-orphans || true
            sudo docker rm -f app-api-1 prometheus grafana || true
            sudo docker network prune -f || true

            # 4️⃣ 최신 이미지 pull
            sudo docker compose pull

            # 5️⃣ 컨테이너 재기동
            sudo docker compose up -d --force-recreate

            # 6️⃣ 안 쓰는 이미지 정리
            sudo docker image prune -f
